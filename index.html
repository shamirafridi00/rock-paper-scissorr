<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .game {
            display: inline-block;
            text-align: left;
        }
        #result-screen {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- create heading of the game and forms to get input and display screen, also show rounds like input field to get round if user input 3 rounds game then the game will be continued for 3 rounds and winner will be displayed -->
   <div class="game">
        <h1>Rock Paper Scissors</h1>
        <label for="rounds">Number of Rounds:</label>
        <input type="number" id="rounds" min="1" value="3">
        <br><br>
        <label for="user-choice">Choose your move:</label>
        <select id="user-choice">
            <option value="rock">Rock</option>
            <option value="paper">Paper</option>
            <option value="scissors">Scissors</option>
        </select>
        <button id="play-button">Start New Game</button>
        <div id="result-screen">
            <h2>Results:</h2>
            <p id="round-result"></p>
            <p id="final-result"></p>
        </div>
    </div>
    

    <script src="game.js"></script>
</body>
</html>
